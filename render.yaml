services:
  - type: web
    name: goodform-gym
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/gym.sqlite
    disk:
      name: gym-data
      mountPath: /var/data
      sizeGB: 1
